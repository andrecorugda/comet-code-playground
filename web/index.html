<!doctype html>
<meta charset="utf-8">
<title>comet — a code playground you can embed</title>
<style>
  :root { color-scheme: light dark; --line: color-mix(in oklab, currentColor 22%, transparent); }
  body { font: 15px/1.5 ui-sans-serif, system-ui, sans-serif; margin: 0; padding: 1.5rem; }
  h1 { font-size: 1.05rem; font-weight: 600; margin: 0 0 .25rem; }
  .sub { opacity: .65; font-size: .85rem; margin: 0 0 1.25rem; }
  .comet { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr auto;
           gap: .75rem; min-height: 70vh; }
  .comet-bar { grid-column: 1 / -1; display: flex; gap: .35rem; }
  .comet-tab { font: inherit; font-size: .85rem; padding: .3rem .7rem; cursor: pointer;
               background: transparent; color: inherit; border: 1px solid var(--line);
               border-radius: 999px; }
  .comet-tab:hover { background: color-mix(in oklab, currentColor 8%, transparent); }
  .comet-in, .comet-out, .comet-scope {
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    border: 1px solid var(--line); border-radius: 8px; padding: .8rem; margin: 0;
    white-space: pre-wrap; overflow: auto; background: transparent; color: inherit;
  }
  .comet-in { resize: none; }
  .comet-out[data-comet-rendered] { white-space: normal; font: inherit; }
  .comet-scope { grid-column: 1 / -1; min-height: 4.5rem; resize: vertical; }
  footer { margin-top: 1.5rem; font-size: .8rem; opacity: .55; }
  footer a { color: inherit; }
</style>

<h1>comet</h1>
<p class="sub">An embeddable code playground. Everything runs in this page — nothing is uploaded.</p>

<div id="root">loading…</div>

<footer>Powered by <a href="https://star.burxt-lang.org">star-burxt</a></footer>

<script>
  // **A module that fails to LOAD never enters its own try/catch**, so the page could not report the
  // one failure most likely to happen while it is being built — a bad import, a syntax error, a 404.
  // This runs as a classic script, before the module, and catches what the module cannot.
  window.__cometReport = (outcome) => {
    try {
      navigator.sendBeacon('/report', JSON.stringify(outcome))
        || fetch('/report', { method: 'POST', body: JSON.stringify(outcome) });
    } catch (e) { /* nothing left to report with */ }
  };
  window.addEventListener('error', (e) => {
    window.__cometReport({ mounted: false,
      error: 'before the module ran: ' + (e.message || 'load error')
             + (e.filename ? ' (' + e.filename + ':' + e.lineno + ')' : '') });
  });
  window.addEventListener('unhandledrejection', (e) => {
    window.__cometReport({ mounted: false, error: 'unhandled rejection: ' + String(e.reason) });
  });
</script>

<script type="module">
  // The page reports its own outcome to whatever is watching, because a headless run cannot know when
  // an async module has finished — `--dump-dom` fires on the load event while this is still going.
  const report = window.__cometReport;

  try {
    const comet = (await import('./comet.js')).default;
    await import('./adapters/bmx.js');
    await import('./adapters/sbmx.js');
    await import('./adapters/burxt.js');

    const app = await comet.mount({
      root: document.querySelector('#root'),
      base: './',
      mode: 'bmx',
      source: '# Receipt {{ reference }}\n\nThank you, {{ name }}. Your total is **{{ total }}**.\n',
      bindings: '{\n  "reference": "A-1042",\n  "name": "Ada",\n  "total": "£49.00"\n}',
    });

    // `mount` seeds the editor and runs once, so there is nothing for this page to drive.
    await new Promise((r) => setTimeout(r, 600));

    document.body.dataset.cometReady = 'yes';
    report({ mounted: true, modes: comet.registered().map((m) => m.id),
             html: document.querySelector('#root').innerHTML });
  } catch (e) {
    document.querySelector('#root').textContent = 'MOUNT FAILED: ' + e.message;
    report({ mounted: false, error: String((e && e.stack) || e) });
  }
</script>
