<!doctype html>
<meta charset="utf-8">
<title>comet — a code playground you can embed</title>
<link rel="stylesheet" href="./vendor/bootstrap.min.css">
<link rel="stylesheet" href="./comet.css">
<style>
  body { padding: 1.5rem; max-width: 76rem; margin: 0 auto; }
  h1 { font-size: 1.05rem; font-weight: 600; margin: 0 0 .2rem; }
  .sub { font-size: .85rem; margin: 0 0 1rem; }
</style>

<h1>comet</h1>
<p class="sub text-body-secondary">An embeddable code playground. Everything runs in this page — nothing is uploaded.</p>

<div id="root">loading…</div>

<footer>Powered by <a href="https://star.burxt-lang.org">star-burxt</a></footer>

<script>
  // **A module that fails to LOAD never enters its own try/catch**, so the page could not report the
  // one failure most likely to happen while it is being built — a bad import, a syntax error, a 404.
  // This runs as a classic script, before the module, and catches what the module cannot.
  window.__cometReport = (outcome) => {
    try {
      navigator.sendBeacon('/report', JSON.stringify(outcome))
        || fetch('/report', { method: 'POST', body: JSON.stringify(outcome) });
    } catch (e) { /* nothing left to report with */ }
  };
  window.addEventListener('error', (e) => {
    window.__cometReport({ mounted: false,
      error: 'before the module ran: ' + (e.message || 'load error')
             + (e.filename ? ' (' + e.filename + ':' + e.lineno + ')' : '') });
  });
  window.addEventListener('unhandledrejection', (e) => {
    window.__cometReport({ mounted: false, error: 'unhandled rejection: ' + String(e.reason) });
  });
</script>

<script type="module">
  // The page reports its own outcome to whatever is watching, because a headless run cannot know when
  // an async module has finished — `--dump-dom` fires on the load event while this is still going.
  const report = window.__cometReport;

  try {
    const comet = (await import('./comet.js')).default;
    await import('./adapters/bmx.js');
    await import('./adapters/sbmx.js');
    await import('./adapters/burxt.js');

    // **The service is configuration, not a constant.** An embed points at whichever control plane
    // serves it, and a Pages embed with no service still works for every language that answers in the
    // browser — which is the whole reason the registry allows both kinds of adapter.
    const params = new URLSearchParams(location.search);
    const service = params.get('service') || '';

    // **A showcase is a mode and a source, so those are parameters rather than constants.** This is not
    // a test affordance: embedding one showcase on a page about one thing is exactly "open in this
    // language, with this code in the editor", and the defaults below are the demo the front page shows.
    const mode = params.get('mode') || 'bmx';
    const given = params.get('source');

    const app = await comet.mount({
      root: document.querySelector('#root'),
      base: './',
      service,
      mode,
      source: given !== null ? given
        : '# Receipt {{ reference }}\n\nThank you, {{ name }}. Your total is **{{ total }}**.\n',
      bindings: '{\n  "reference": "A-1042",\n  "name": "Ada",\n  "total": "£49.00"\n}',
    });

    // **A fixed sleep is not a condition, and this one was a race.** `mount` seeds the editor and runs
    // once, but the first render lands asynchronously — so 600ms was a guess that the DOM had caught up.
    // It usually had. Under repeated runs it lost once in five: the report went out before
    // `data-comet-rendered` existed, and the harness reported "the default document did not render"
    // about a page that rendered it a moment later. **A check that usually passes is worse than one that
    // fails**, because it teaches everyone to re-run instead of to look.
    //
    // Found by porting the harness to Burxt and therefore running it five times in a row. One harness
    // run proves nothing about a race; the flake is in this page and both harnesses inherited it.
    //
    // So this waits for the condition. The deadline stays, but only as a floor for REPORTING: if the
    // render never lands, the report still goes out and still says so, rather than hanging and letting
    // an outer `timeout` decide what happened.
    // **It waits for AN ANSWER, not for a rendered one.** The first version watched only for
    // `[data-comet-rendered]`, which a preview sets — so a language whose answer is TEXT never satisfied
    // it and the page sat out the whole loop before reporting. A service-backed run is text, and it also
    // takes a second or two rather than milliseconds, so the two failures compounded: waiting for the
    // wrong thing, for less time than the right thing needs.
    //
    // The condition is "the output pane has something in it, or a preview was promoted", and the budget
    // is generous because a sandbox has to start.
    const answered = () => {
      if (document.querySelector('[data-comet-rendered]')) return true;
      const out = document.querySelector('.comet-out');
      return !!(out && (out.textContent || '').trim().length > 0);
    };
    let landed = false;
    for (let i = 0; i < 600 && !landed; i += 1) {
      landed = answered();
      if (!landed) await new Promise((r) => setTimeout(r, 50));
    }

    document.body.dataset.cometReady = 'yes';
    report({ mounted: true, rendered: landed, modes: comet.registered().map((m) => m.id),
             html: document.querySelector('#root').innerHTML });
  } catch (e) {
    document.querySelector('#root').textContent = 'MOUNT FAILED: ' + e.message;
    report({ mounted: false, error: String((e && e.stack) || e) });
  }
</script>
